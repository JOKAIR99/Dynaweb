name: Feature request
description: Propose a new capability for Dynaweb Studio.
labels: [enhancement, needs review]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Dynaweb does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention which part of the site model (src/model/schema.ts) it would change, if you know.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Backend, AI integration, Templates and components, Export and publishing, Performance, Accessibility, Other]
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
